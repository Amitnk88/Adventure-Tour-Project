    <style>

<body>

<div class="container">
    <div class="title">All Bookings Till Now</div>
    <div id="bookingTableContainer"></div>
    <button class="download-button" onclick="downloadExcel()">Download </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>

<script>
    async function fetchBookings() {
        try {
            const response = await fetch('http://localhost:3000/bookings');
            const data = await response.json();

            if (data.success && data.bookings.length > 0) {
                let tableHTML = `
                    <table>
                        <tr>
                            <th>ID</th>
                            <th>Customer Name</th>
                            <th>Location</th>
                            <th>Check-in Date</th>
                            <th>Check-out Date</th>
                            <th>Accommodation Type</th>
                            <th>Phone No</th>
                            <th>code</th>

                        </tr>
                `;

                data.bookings.forEach(booking => {
                    tableHTML += `
                        <tr>
                            <td>${booking.id}</td>
                            <td>${booking.first_name} ${booking.last_name}</td>
                            <td>${booking.Location}</td>
                            <td>${booking.check_in_date}</td>
                            <td>${booking.check_out_date}</td>
                            <td>${booking.accommodation_type}</td>
                            <td>${booking.phone_number}</td>
                            <td>${booking.code}</td>
                        </tr>
                    `;
                });

                tableHTML += `</table>`;
                document.getElementById('bookingTableContainer').innerHTML = tableHTML;
            } else {
                document.getElementById('bookingTableContainer').innerHTML = '<p>No bookings found.</p>';
            }
        } catch (error) {
            document.getElementById('bookingTableContainer').innerHTML = `<p class='error-message'>Error: ${error.message}</p>`;
        }
    }

    function downloadExcel() {
        const bookingTableContainer = document.getElementById('bookingTableContainer');
        const table = bookingTableContainer.querySelector("table");

        if (!table) {
            alert("No bookings data to download");
            return;
        }

        const workbook = XLSX.utils.table_to_book(table, { sheet: "Bookings" });
        const excelFileName = 'all_bookings.xlsx';

        XLSX.writeFile(workbook, excelFileName);
    }

    // Fetch bookings on page load
    window.onload = fetchBookings;
</script>

</body>
